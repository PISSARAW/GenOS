syntax = "proto3";

package genos;

service MemoryService {
  rpc SearchMemory (SearchRequest) returns (SearchResponse);
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
}

message MemoryItem {
  string id = 1;
  string title = 2;
  string summary = 3;
  double score = 4;
}

message SearchResponse {
  repeated MemoryItem results = 1;
}
