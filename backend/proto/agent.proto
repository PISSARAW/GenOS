syntax = "proto3";
package genos.agent.v1;

service AgentService {
  rpc Ping (Empty) returns (PingResponse);
  rpc StartMission (AgentMission) returns (MissionResponse);
  rpc StopMission (AgentId) returns (StatusResponse);
}

message Empty {}
message PingResponse { string status = 1; }
message AgentMission {
  string agent_id = 1;
  string name = 2;
  string role = 3;
  string prompt = 4;
  string model_tier = 5;
  string workspace_root = 6;
  string workspace_isolation = 7;
  string agent_type = 8;
  string execution_mode = 9;
  string strategy_contract_json = 10;
  string orchestrator_agent_id = 11;
  string autonomy_plan_json = 12;
  string tool_lease_json = 13;
  string genos_capsule_json = 14;
  string execution_policy_json = 15;
  string execution_budget_json = 16;
  string name_meaning = 20;
  bool tool_gating_enabled = 21;
  float gating_threshold_mv = 22;
  string disinhibited_tools_json = 23;
  // Selected local model and routing policy for the local cognitive runtime.
  // Without these the worker receives no model hint and the router falls back
  // to auto-discovery, silently loading an arbitrary (often huge) model.
  string local_model = 24;
  string local_routing_policy_json = 25;
  bytes prompt_capsule = 26;
  // Dynamic capability contract and manifest for capability-aware dispatch.
  repeated string capabilities = 27;
  string capability_manifest_json = 28;
  string worker_kind = 29;
  string worker_contract_json = 30;
}
message AgentId { string id = 1; }
message MissionResponse { bool success = 1; string message = 2; }
message StatusResponse { bool stopped = 1; string status = 2; }
