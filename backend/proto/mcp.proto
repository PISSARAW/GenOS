syntax = "proto3";
package genos.mcp;

service McpService {
  rpc Ping (Empty) returns (PingResponse);
  rpc ListTools (Empty) returns (ToolsListResponse);
  rpc CallTool (ToolCallRequest) returns (ToolCallResponse);
  rpc EvaluateGating (GatingRequest) returns (GatingResponse);
}

message Empty {}
message PingResponse { string status = 1; }
message ToolsListResponse { repeated ToolDef tools = 1; string contract_version = 2; }
message ToolDef { string name = 1; string description = 2; string schema_json = 3; }
message ToolCallRequest { string tool_name = 1; string arguments_json = 2; }
message ToolCallResponse { bool success = 1; string content_json = 2; string error = 3; }
message GatingRequest { string query = 1; repeated string candidate_tools = 2; float threshold_mv = 3; }
message GatingResponse { bool requires_tools = 1; repeated string disinhibited_tools = 2; float membrane_potential_mv = 3; string gate_state = 4; string reason = 5; }
