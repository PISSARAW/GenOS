[package]
name = "genos-orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
genos-cell = { path = "../genos-cell" }
genos-biology = { path = "../genos-biology" }
genos-genome = { path = "../genos-genome" }
genos-signal = { path = "../genos-signal" }
genos-immune = { path = "../genos-immune" }
genos-common = { path = "../genos-common" }
genos-store = { path = "../genos-store" }
genos-reproduction = { path = "../genos-reproduction" }
genos-sensorimotor = { path = "../genos-sensorimotor" }
genos-dna = { path = "../genos-dna" }
genos-worker = { path = "../genos-worker" }
genos-api = { path = "../genos-api", optional = true }
reqwest = { version = "0.13.4", features = ["blocking", "json"], optional = true }
rand = "0.10"
tokio = { version = "1", features = ["sync", "macros", "time"] }
crossbeam = "0.8"
rmp-serde = "1.3"
toml = "1.1"
syn = { version = "2", features = ["full", "visit"] }
sha2 = { version = "0.10.9", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# Accès à la couche serveur/sécurité de GenOS (tokio + reqwest).
api = ["dep:genos-api", "dep:reqwest", "dep:sha2"]

[[example]]
name = "receipt_bridge"
required-features = ["api"]
