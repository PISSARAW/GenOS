[package]
name = "genos-api"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
dotenv = "0.15.0"
tokio = { version = "1.53.1", features = ["full"] }

[[bin]]
name = "genos-api"
path = "src/main.rs"

