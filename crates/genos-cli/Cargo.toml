[package]
name = "genos-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "genos"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
genos-cell = { path = "../genos-cell" }
genos-orchestrator = { path = "../genos-orchestrator" }
genos-biology = { path = "../genos-biology" }
genos-genome = { path = "../genos-genome" }
genos-signal = { path = "../genos-signal" }
genos-reproduction = { path = "../genos-reproduction" }
