[package]
name = "genos-simple-cli"
version = "0.1.0"
edition = "2021"
description = "User-friendly CLI wrapper for GenOS"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "g"
path = "src/main.rs"
