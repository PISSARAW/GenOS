[package]
name = "genos-dna"
version = "0.1.0"
edition = "2024"

[dependencies]
genos-genome = { path = "../genos-genome" }
genos-reproduction = { path = "../genos-reproduction" }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
crc32fast = "1.5"
uuid = { version = "1.10", features = ["v4"] }
sha2 = "0.10"
rand = "0.10"

[dev-dependencies]
serde_json = "1.0"
