name: Feature request
description: Propose a focused capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues, pull requests, ADRs, and the roadmap.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or system problem should GenOS solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and how success could be verified.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Optional API, CLI, schema, or architecture sketch.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: What other approaches or workarounds were considered?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core model and invariants
        - Runtime and experiments
        - Worlds and isolation
        - Storage and replay
        - Models and tools
        - Evaluation and merge
        - CLI or API
        - Schemas and documentation
        - Other
    validations:
      required: true
