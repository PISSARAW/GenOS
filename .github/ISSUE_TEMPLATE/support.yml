name: Support question
description: Ask a focused question about using or developing GenOS
title: "[Support]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Please do not include secrets or private data. Do not use this form
        for suspected vulnerabilities; follow `SECURITY.md` instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues, pull requests, and the documentation.
          required: true
        - label: This question contains no secrets or private data.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup and development
        - CLI or API
        - Runtime and experiments
        - Worlds and isolation
        - Storage and replay
        - Studio
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: State the goal, what you tried, and where you are blocked.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the revision, environment, relevant command, and redacted output.
