name: Bug report
description: Report reproducible incorrect behavior in GenOS
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve GenOS. Do not report security vulnerabilities here; follow `SECURITY.md` instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This report contains no secrets or private data.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: revision
    attributes:
      label: GenOS revision
      description: Commit SHA, tag, or branch name.
      placeholder: 0123456 or main
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, and `rustc --version`.
      placeholder: Windows 11 x86_64, rustc 1.xx.x
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest command, manifest, or code sample that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant output or a redacted stack trace.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, affected invariants, or suspected regressions.
