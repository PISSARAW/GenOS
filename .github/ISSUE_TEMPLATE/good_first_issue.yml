name: Good first issue
description: A maintainer-scoped contribution suitable for a first change
title: "[Good first issue]: "
labels:
  - good first issue
body:
  - type: markdown
    attributes:
      value: |
        Maintainers: define a small, verified scope before publishing this issue.
        Contributors: comment before starting if someone may already be working on it.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the observable result, not a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: pointers
    attributes:
      label: Starting points
      description: List the smallest relevant files, tests, and documentation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide a checklist with commands that a contributor can run locally.
      value: |
        - [ ] The focused test passes.
        - [ ] Related documentation is updated.
        - [ ] No existing supported behavior regresses.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Out of scope
      description: State adjacent work that this issue should not expand into.
    validations:
      required: true
  - type: input
    id: verification
    attributes:
      label: Verification command
      placeholder: cargo test -p package --test focused_test
    validations:
      required: true
