name: GenOS validation

on:
  push:
    branches: [v3]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  node:
    name: Node validation (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    env:
      GENOS_ADMIN_PASSWORD: ci-test-only
      GENOS_CI_OS: ${{ matrix.os }}
      GENOS_CI_NODE: ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify diagnostic runner
        run: node scripts/ci/test_run_with_diagnostics.cjs
      - name: Install root dependencies
        run: node scripts/ci/run_with_diagnostics.cjs --output artifacts/ci/root-install.json --name root-install -- npm ci
      - name: Install backend dependencies
        run: node scripts/ci/run_with_diagnostics.cjs --output artifacts/ci/backend-install.json --name backend-install -- npm ci --prefix backend
      - name: Run validation suite
        run: node scripts/ci/run_with_diagnostics.cjs --output artifacts/ci/validation.json --name validation -- npm --prefix backend run test:validation
      - name: Publish CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_id }}
          path: artifacts/ci
          if-no-files-found: error
          retention-days: 14

  node-complete:
    name: Complete Node suite (Ubuntu, Node 20)
    runs-on: ubuntu-latest
    env:
      GENOS_ADMIN_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix backend
      - run: python scripts/ci/test_check_code_quality.py
      - run: python scripts/ci/test_rust_nasm_bootstrap.py
      - run: python scripts/ci/check_code_quality.py --report-json quality-report.json
      - name: Publish complete quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genos-quality-report
          path: quality-report.json
      - run: npm test
      - run: npm --prefix backend run test:morphogenesis
      - run: npm --prefix backend run test:grpc
      - run: npm --prefix backend run test:quality
      - run: npm --prefix backend run test:mcp
      - run: npm --prefix backend run test:tenancy
      - run: npm --prefix backend run test:migration
      - run: npm --prefix backend run test:recovery
      - run: npm --prefix backend run test:concurrency
      - run: npm --prefix backend run test:distributed-parity

  windows-rust:
    name: Rust CLI (Windows)
    runs-on: windows-latest
    env:
      GENOS_ADMIN_PASSWORD: ci-test-only
      # aws-lc-sys writes a shared archive while building its native objects.
      # Serializing this job avoids MSVC LNK1114 races on hosted Windows disks.
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NASM for aws-lc-sys
        run: ./scripts/ci/install-nasm.ps1 -Install -Yes -PackageManager choco
      - run: ./scripts/ci/rust-test.ps1 -p genos-cli --bin genos
