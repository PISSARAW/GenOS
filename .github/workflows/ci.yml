name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: format, lint, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace --all-targets

  counterfactual-demo:
    name: counterfactual demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: bash examples/counterfactual-demo/run-demo.sh
          - os: windows-latest
            script: pwsh -NoProfile -File examples/counterfactual-demo/run-demo.ps1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The script asserts on its own via the CLI `--expect-*` flags, so a failed
      # invariant already fails this step. The next step re-checks the observable
      # output so a silently gutted script cannot pass.
      - name: Run the demo
        shell: bash
        run: ${{ matrix.script }} 2>&1 | tee demo-output.txt

      - name: Assert demo output
        shell: bash
        run: |
          demo_dir=".genos/demo/clone-without-llm"

          assert_output() {
            if ! grep -qF "$1" demo-output.txt; then
              echo "Assertion failed: demo output is missing '$1'" >&2
              exit 1
            fi
          }

          assert_lines() {
            local file="$1" expected="$2"
            if [ ! -f "$file" ]; then
              echo "Assertion failed: $file was not produced" >&2
              exit 1
            fi
            local actual
            actual="$(grep -c '' "$file")"
            if [ "$actual" -ne "$expected" ]; then
              echo "Assertion failed: expected $expected lines in $file, got $actual" >&2
              exit 1
            fi
          }

          assert_output 'Demo OK: Agent A -> snapshot S0 -> forks A1/A2'
          assert_output '"count": 2'
          assert_output '"same_logical_state": true'
          assert_output '"differing_fields": []'
          assert_output '"distinct_identity": true'
          assert_output '"event_cursors_bound_to_own_branch": true'
          assert_output '"last_sequence": 1'

          # Untouched forks diff to nothing, despite distinct identity.
          assert_output '"empty": true'
          assert_output '"entry_count": 0'
          assert_output '"changed_paths": []'

          # One genome value changed -> exactly one entry, reported by path and
          # at the precision the f32 field actually holds.
          assert_output 'GenomeDiff'
          assert_output '  genome.cognition.chromosomes[0].loci[0].value'
          assert_output '    old: 0.7'
          assert_output '    new: 0.8'
          assert_output '1 changed path'
          if grep -q '0.699999' demo-output.txt; then
            echo "Assertion failed: a widened f32 leaked into the diff report" >&2
            exit 1
          fi

          # S0 plus the two forks, and one fork_created event per fork.
          assert_lines "$demo_dir/agent-snapshots.jsonl" 3
          assert_lines "$demo_dir/agent-events.jsonl" 2

          for field in agent_id branch_id; do
            distinct="$(grep -o "\"$field\":\"[^\"]*\"" "$demo_dir/agent-events.jsonl" | sort -u | grep -c '')"
            if [ "$distinct" -ne 2 ]; then
              echo "Assertion failed: expected 2 distinct $field in the event store, got $distinct" >&2
              exit 1
            fi
          done

          echo "Counterfactual demo assertions passed."

      - name: Upload demo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterfactual-demo-${{ matrix.os }}
          path: |
            demo-output.txt
            .genos/demo/clone-without-llm/
          if-no-files-found: warn

  divergent-writes-demo:
    name: divergent writes demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: bash examples/divergent-writes-demo/run-demo.sh
          - os: windows-latest
            script: pwsh -NoProfile -File examples/divergent-writes-demo/run-demo.ps1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The script asserts on its own via the CLI `--expect-*` flags, so a failed
      # invariant already fails this step. The next step re-checks the observable
      # output so a silently gutted script cannot pass.
      - name: Run the demo
        shell: bash
        run: ${{ matrix.script }} 2>&1 | tee demo-output.txt

      - name: Assert demo output
        shell: bash
        run: |
          demo_dir=".genos/demo/divergent-writes"

          assert_output() {
            if ! grep -qF "$1" demo-output.txt; then
              echo "Assertion failed: demo output is missing '$1'" >&2
              exit 1
            fi
          }

          assert_file() {
            if ! grep -qF "$2" "$1"; then
              echo "Assertion failed: $1 is missing '$2'" >&2
              exit 1
            fi
          }

          assert_lines() {
            local file="$1" expected="$2"
            if [ ! -f "$file" ]; then
              echo "Assertion failed: $file was not produced" >&2
              exit 1
            fi
            local actual
            actual="$(grep -c '' "$file")"
            if [ "$actual" -ne "$expected" ]; then
              echo "Assertion failed: expected $expected lines in $file, got $actual" >&2
              exit 1
            fi
          }

          assert_output 'Demo OK: S0(counter=0) -> A1(counter=10) | A2(counter=20)'
          assert_output '"isolated": true'
          assert_output '"parent_preserved": true'
          assert_output '"branches_hold_expected_values": true'
          assert_output '"branch_values_distinct": true'
          assert_output '"violations": []'
          assert_output '"distinct_identity": true'

          # The structural diff names the diverged variable by key.
          assert_output '"empty": false'
          assert_output '"path": "state.working_memory.counter"'
          assert_output '"before": "10"'
          assert_output '"after": "20"'

          # The parent kept its pre-fork value while each branch kept its own,
          # both on the snapshot files and on the ids resolved in the store.
          if [ "$(grep -c '"actual_value": "0"' demo-output.txt)" -ne 2 ]; then
            echo "Assertion failed: expected the parent to read counter=0 in both checks" >&2
            exit 1
          fi
          for value in 10 20; do
            if [ "$(grep -c "\"actual_value\": \"$value\"" demo-output.txt)" -ne 2 ]; then
              echo "Assertion failed: expected a branch to read counter=$value in both checks" >&2
              exit 1
            fi
          done

          # A memory recorded on A1 only, reported as one added record with the
          # branch it came from.
          assert_output '(added)'
          assert_output '    new: The API uses PostgreSQL'
          assert_output '    provenance: created in branch '
          assert_output 'source=schema-probe'
          assert_output '5 changed paths'

          # S0, the two forks, the two forks again after their write, and A1
          # again after its memory; one write event per branch plus A1's memory.
          assert_lines "$demo_dir/agent-snapshots.jsonl" 6
          assert_lines "$demo_dir/agent-events.jsonl" 3

          # The memory event is on A1's branch and nowhere else.
          memory_events="$(grep -c '"event_type":"memory_created"' "$demo_dir/agent-events.jsonl")"
          if [ "$memory_events" -ne 1 ]; then
            echo "Assertion failed: expected 1 memory_created event, got $memory_events" >&2
            exit 1
          fi

          assert_file "$demo_dir/agent-events.jsonl" '"key":"counter","previous_value":"0","value":"10"'
          assert_file "$demo_dir/agent-events.jsonl" '"key":"counter","previous_value":"0","value":"20"'

          for field in agent_id branch_id; do
            distinct="$(grep -o "\"$field\":\"[^\"]*\"" "$demo_dir/agent-events.jsonl" | sort -u | grep -c '')"
            if [ "$distinct" -ne 2 ]; then
              echo "Assertion failed: expected 2 distinct $field in the event store, got $distinct" >&2
              exit 1
            fi
          done

          echo "Divergent writes demo assertions passed."

      - name: Upload demo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: divergent-writes-demo-${{ matrix.os }}
          path: |
            demo-output.txt
            .genos/demo/divergent-writes/
          if-no-files-found: warn

  divergent-worlds-demo:
    name: divergent worlds demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: bash examples/divergent-worlds-demo/run-demo.sh
          - os: windows-latest
            script: pwsh -NoProfile -File examples/divergent-worlds-demo/run-demo.ps1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The script asserts on its own via `--expect-isolated`, so a failed
      # invariant already fails this step. The next step re-checks the observable
      # output so a silently gutted script cannot pass.
      - name: Run the demo
        shell: bash
        run: ${{ matrix.script }} 2>&1 | tee demo-output.txt

      - name: Assert demo output
        shell: bash
        run: |
          demo_dir=".genos/demo/divergent-worlds"

          assert_output() {
            if ! grep -qF "$1" demo-output.txt; then
              echo "Assertion failed: demo output is missing '$1'" >&2
              exit 1
            fi
          }

          assert_count() {
            local needle="$1" expected="$2" actual
            actual="$(grep -cF "$needle" demo-output.txt)"
            if [ "$actual" -ne "$expected" ]; then
              echo "Assertion failed: expected '$needle' $expected times, got $actual" >&2
              exit 1
            fi
          }

          assert_output 'Demo OK: W0(hello) -> A(bonjour) | B(hola)'
          assert_output '"isolated": true'
          assert_output '"parent_preserved": true'
          assert_output '"branches_hold_expected_contents": true'
          assert_output '"branch_contents_distinct": true'
          assert_output '"violations": []'
          assert_output '"files_changed": 1'

          # The two isolation checks: against the parent world, then against a
          # world re-forked from the snapshot after both writes.
          assert_count '"isolated": true' 2
          assert_count '"actual_contents": "hello"' 2
          assert_count '"actual_contents": "bonjour"' 2
          assert_count '"actual_contents": "hola"' 2

          # W0, A, B and the late fork, each materialized as its own directory.
          world_count="$(find "$demo_dir/world/worlds" -mindepth 1 -maxdepth 1 -type d | grep -c '')"
          if [ "$world_count" -ne 4 ]; then
            echo "Assertion failed: expected 4 worlds on disk, got $world_count" >&2
            exit 1
          fi

          # Exactly one world holds each value, and the parent kept "hello".
          for value in hello bonjour hola; do
            matches="$(grep -rlx "$value" "$demo_dir/world/worlds" | grep -c '')"
            expected=1
            # "hello" survives in the parent world and in the late fork.
            if [ "$value" = "hello" ]; then expected=2; fi
            if [ "$matches" -ne "$expected" ]; then
              echo "Assertion failed: expected $expected world(s) holding '$value', got $matches" >&2
              exit 1
            fi
          done

          echo "Divergent worlds demo assertions passed."

      - name: Upload demo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: divergent-worlds-demo-${{ matrix.os }}
          path: |
            demo-output.txt
            .genos/demo/divergent-worlds/
          if-no-files-found: warn
