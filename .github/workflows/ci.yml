name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  counterfactual-demo:
    name: counterfactual demo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: bash examples/counterfactual-demo/run-demo.sh
          - os: windows-latest
            script: pwsh -NoProfile -File examples/counterfactual-demo/run-demo.ps1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The script asserts on its own via the CLI `--expect-*` flags, so a failed
      # invariant already fails this step. The next step re-checks the observable
      # output so a silently gutted script cannot pass.
      - name: Run the demo
        shell: bash
        run: ${{ matrix.script }} 2>&1 | tee demo-output.txt

      - name: Assert demo output
        shell: bash
        run: |
          demo_dir=".genos/demo/clone-without-llm"

          assert_output() {
            if ! grep -qF "$1" demo-output.txt; then
              echo "Assertion failed: demo output is missing '$1'" >&2
              exit 1
            fi
          }

          assert_lines() {
            local file="$1" expected="$2"
            if [ ! -f "$file" ]; then
              echo "Assertion failed: $file was not produced" >&2
              exit 1
            fi
            local actual
            actual="$(grep -c '' "$file")"
            if [ "$actual" -ne "$expected" ]; then
              echo "Assertion failed: expected $expected lines in $file, got $actual" >&2
              exit 1
            fi
          }

          assert_output 'Demo OK: Agent A -> snapshot S0 -> forks A1/A2'
          assert_output '"count": 2'
          assert_output '"same_logical_state": true'
          assert_output '"differing_fields": []'
          assert_output '"distinct_identity": true'
          assert_output '"event_cursors_bound_to_own_branch": true'
          assert_output '"last_sequence": 1'

          # S0 plus the two forks, and one fork_created event per fork.
          assert_lines "$demo_dir/agent-snapshots.jsonl" 3
          assert_lines "$demo_dir/agent-events.jsonl" 2

          for field in agent_id branch_id; do
            distinct="$(grep -o "\"$field\":\"[^\"]*\"" "$demo_dir/agent-events.jsonl" | sort -u | grep -c '')"
            if [ "$distinct" -ne 2 ]; then
              echo "Assertion failed: expected 2 distinct $field in the event store, got $distinct" >&2
              exit 1
            fi
          done

          echo "Counterfactual demo assertions passed."

      - name: Upload demo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counterfactual-demo-${{ matrix.os }}
          path: |
            demo-output.txt
            .genos/demo/clone-without-llm/
          if-no-files-found: warn
