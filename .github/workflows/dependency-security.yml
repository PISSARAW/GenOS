name: Dependency security

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  cargo-audit:
    name: Audit Cargo dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # `paste` is an unmaintained compile-time macro pulled in by metal 0.32.
        # Owner: GenOS maintainers. Review by 2026-09-30 or before next release;
        # track gfx-rs/metal-rs and keep the exception pinned to this advisory.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

  npm-audit:
    name: Audit npm dependencies (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [research/reverse-game-of-life, backend, studio]
    steps:
      - uses: actions/checkout@v7

      - name: Audit locked npm dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high
