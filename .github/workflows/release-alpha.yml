name: Release alpha

on:
  push:
    tags:
      - "v*-alpha.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-alpha-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-source:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cargo_version: ${{ steps.source.outputs.cargo_version }}
      release_id: ${{ steps.source.outputs.release_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Verify tag, commit, and Cargo version
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$cargo_version"
          source_sha="$(git rev-parse HEAD)"
          tag=""
          release_id="${cargo_version}-manual.${GITHUB_RUN_NUMBER}"

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            tag="$EVENT_TAG"
            git show-ref --verify --quiet "refs/tags/$tag"
            tagged_sha="$(git rev-parse "$tag^{commit}")"
            test "$tagged_sha" = "$source_sha"
            if [[ "$EVENT_NAME" == "push" ]]; then
              test "$tagged_sha" = "$GITHUB_SHA"
            fi
            if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-alpha\.([0-9]+)$ ]] \
              || [[ "${BASH_REMATCH[1]:-}" != "$cargo_version" ]]; then
              echo "Tag '$tag' must match Cargo version $cargo_version (v${cargo_version}-alpha.N)." >&2
              exit 1
            fi
            release_id="${tag#v}"
          fi

          {
            echo "cargo_version=$cargo_version"
            echo "release_id=$release_id"
            echo "source_sha=$source_sha"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          {
            echo "release_id=$release_id"
            echo "cargo_version=$cargo_version"
            echo "source_sha=$source_sha"
            echo "tag=${tag:-manual-build}"
          } > SOURCE-PROVENANCE.txt

      - name: Upload source provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-provenance
          path: SOURCE-PROVENANCE.txt
          if-no-files-found: error
          retention-days: 14

  test-source:
    name: Test verified source
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.verify-source.outputs.source_sha }}

      - name: Assert exact verified source
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          scripts/assert-source-sha.sh "$SOURCE_SHA"
          wrong_sha="0${SOURCE_SHA:1}"
          if [[ "$wrong_sha" == "$SOURCE_SHA" ]]; then
            wrong_sha="1${SOURCE_SHA:1}"
          fi
          if scripts/assert-source-sha.sh "$wrong_sha"; then
            echo "Negative source-SHA gate unexpectedly accepted a mismatch." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-22
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: source-tests

      - name: Test CLI
        run: cargo test --locked -p genos-cli

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Test bootstrap authentication
        working-directory: backend
        run: node test_auth_bootstrap.js

      - name: Test agent runtime adapter
        working-directory: backend
        run: node test_agent_runtime_adapter.js

      - name: Build Studio
        working-directory: studio
        run: |
          npm ci
          npm run build

  build-cli:
    name: genos (${{ matrix.label }})
    needs: verify-source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: genos
          - label: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: genos
          - label: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: genos
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: genos.exe

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.verify-source.outputs.source_sha }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, pinned 2026-08-22
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build CLI
        run: cargo build --locked --release -p genos-cli --target ${{ matrix.target }}

      - name: Package CLI
        shell: bash
        env:
          ARCHIVE_FORMAT: ${{ matrix.archive }}
          BINARY_NAME: ${{ matrix.binary }}
          CARGO_VERSION: ${{ needs.verify-source.outputs.cargo_version }}
          PACKAGE_NAME: genos-${{ needs.verify-source.outputs.release_id }}-${{ matrix.target }}
          SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version_output="$("target/$TARGET/release/$BINARY_NAME" --version)"
          test "$version_output" = "genos $CARGO_VERSION"
          mkdir -p "dist" "staging/$PACKAGE_NAME"
          cp "target/$TARGET/release/$BINARY_NAME" "staging/$PACKAGE_NAME/"
          cp LICENSE README.md "staging/$PACKAGE_NAME/"
          {
            echo "cargo_version=$CARGO_VERSION"
            echo "source_sha=$SOURCE_SHA"
            echo "target=$TARGET"
            rustc --version
          } > "staging/$PACKAGE_NAME/BUILD-PROVENANCE.txt"

          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            7z a "dist/$PACKAGE_NAME.zip" "./staging/$PACKAGE_NAME/*"
          else
            tar -C staging -czf "dist/$PACKAGE_NAME.tar.gz" "$PACKAGE_NAME"
          fi

      - name: Upload packaged CLI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genos-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA-256 checksums
    needs: [verify-source, build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: genos-*
          path: dist
          merge-multiple: true

      - name: Generate checksum manifest
        working-directory: dist
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)"
          test "$count" -eq 4
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload checksum manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  attach-prerelease:
    name: Attach prerelease assets
    if: github.event_name == 'push'
    needs: [verify-source, test-source, build-cli, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify-source.outputs.release_id }}
          RELEASE_TAG: ${{ needs.verify-source.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 4
          (cd dist && sha256sum --check SHA256SUMS.txt)
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -name "genos-$RELEASE_ID-*" | grep -q .
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to mutate a prerelease that may predate this source gate." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --prerelease \
            --generate-notes \
            --target "$SOURCE_SHA" \
            --title "GenOS $RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"
