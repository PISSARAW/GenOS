experiences:
  - branch_id: A
    conditions: ["baseline load without Redis"]
    observations:
      - item_id: A-locks
        description: "contention remains below the target threshold"
        evidence: ["trace:A:locks"]
    actions:
      - item_id: A-remove-redis
        description: "removed Redis from the request path"
    results:
      - item_id: A-load-test
        description: "latency objective still passes"
        evidence: ["benchmark:A:p99"]
    beliefs_created:
      - claim_id: A-no-redis
        branch_id: A
        subject: redis
        predicate: useful
        object_value: "false"
        kind: result
        statement: "Redis appears unnecessary"
        confidence: 0.90
        evidence: ["branch-A: load test succeeds without Redis"]
    uncertainty:
      - item_id: A-scale
        description: "result may change beyond the tested write volume"
    evidence: ["experiment:A"]

  - branch_id: B
    conditions: ["high write contention with Redis enabled"]
    observations:
      - item_id: B-locks
        description: "database lock waits fall after caching is enabled"
        evidence: ["trace:B:locks"]
    actions:
      - item_id: B-enable-redis
        description: "introduced Redis on the contended request path"
    results:
      - item_id: B-p99
        description: "p99 latency and lock waits improve"
        evidence: ["benchmark:B:p99"]
    beliefs_created:
      - claim_id: B-redis-contention
        branch_id: B
        subject: redis
        predicate: useful
        object_value: "true"
        kind: observation
        statement: "Redis reduces contention"
        confidence: 0.95
        evidence: ["branch-B: p99 lock wait falls after Redis introduction"]
    failures:
      - item_id: B-complexity
        description: "operational complexity increases"
    evidence: ["experiment:B"]

  - branch_id: C
    conditions: ["PostgreSQL query-plan and lock-graph analysis"]
    observations:
      - item_id: C-lock-graph
        description: "lock amplification originates in the PostgreSQL write path"
        evidence: ["trace:C:lock-graph"]
    discoveries:
      - item_id: C-root-cause
        description: "a storage-level contention mechanism explains the incident"
        evidence: ["analysis:C:query-plan"]
    beliefs_modified:
      - claim_id: C-postgres-root
        branch_id: C
        subject: contention
        predicate: root_cause
        object_value: postgresql
        kind: discovery
        statement: "PostgreSQL storage behavior is the likely root cause"
        confidence: 0.92
        evidence: ["branch-C: query plan and lock graph isolate PostgreSQL"]
    evidence: ["experiment:C"]

relations:
  - from_claim: A-no-redis
    to_claim: B-redis-contention
    kind: contradicts
    confidence: 0.88
    evidence: ["Redis produces different utility under the tested conditions"]
  - from_claim: C-postgres-root
    to_claim: A-no-redis
    kind: explains
    confidence: 0.91
    evidence: ["fixing the PostgreSQL lock path removes the need for Redis"]
  - from_claim: C-postgres-root
    to_claim: B-redis-contention
    kind: qualifies
    confidence: 0.89
    evidence: ["Redis mitigates symptoms without establishing the root cause"]

config:
  acceptance_threshold: 0.75
  minimum_independent_branches: 1
