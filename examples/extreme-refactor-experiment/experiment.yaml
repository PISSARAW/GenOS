name: extreme-refactor
seed_dir: critical-monolith
branches:
  - id: event-driven
    label: event-driven
    hypothesis: events as the integration boundary
    edits: [{ relative_path: architecture/family.txt, contents: "event-driven\n" }]
  - id: Kafka
    parent: event-driven
    label: Kafka
    hypothesis: durable event log
    edits: [{ relative_path: architecture/strategy.txt, contents: "Kafka\n" }]
    verifications: &pipeline
      - { kind: tests, command: "cargo test --quiet" }
      - { kind: benchmark, command: "cargo run --quiet --bin benchmark" }
      - { kind: fuzzing, command: "cargo run --quiet --bin fuzz" }
      - { kind: data_migration, command: "cargo run --quiet --bin migrate" }
  - id: NATS
    parent: event-driven
    label: NATS
    hypothesis: lightweight messaging
    edits: [{ relative_path: architecture/strategy.txt, contents: "NATS\n" }]
    verifications: *pipeline
  - id: DB-outbox
    parent: event-driven
    label: DB outbox
    hypothesis: transactional outbox
    edits: [{ relative_path: architecture/strategy.txt, contents: "DB outbox\n" }]
    verifications: *pipeline
  - id: modular-monolith
    label: modular-monolith
    hypothesis: modularity before distribution
    edits: [{ relative_path: architecture/family.txt, contents: "modular-monolith\n" }]
  - id: vertical-slices
    parent: modular-monolith
    label: vertical slices
    hypothesis: slice by use case
    edits: [{ relative_path: architecture/strategy.txt, contents: "vertical slices\n" }]
    verifications: *pipeline
  - id: domain-modules
    parent: modular-monolith
    label: domain modules
    hypothesis: enforce domain boundaries
    edits: [{ relative_path: architecture/strategy.txt, contents: "domain modules\n" }]
    verifications: *pipeline
  - id: async-workers
    label: async-workers
    hypothesis: move bottlenecks behind workers
    edits: [{ relative_path: architecture/family.txt, contents: "async-workers\n" }]
  - id: Redis-queues
    parent: async-workers
    label: Redis queues
    hypothesis: managed asynchronous queues
    edits: [{ relative_path: architecture/strategy.txt, contents: "Redis queues\n" }]
    verifications: *pipeline
  - id: custom-scheduler
    parent: async-workers
    label: custom scheduler
    hypothesis: own the scheduling runtime
    edits: [{ relative_path: architecture/strategy.txt, contents: "custom scheduler\n" }]
    verifications: *pipeline
evaluations:
  - branch_id: Kafka
    hypothesis: durable event log
    outcome: rejected
    outcome_reason: dual-write migration risk and operational load were too high
    metrics: [{ objective: correctness, score: .90 }, { objective: throughput, score: .95 }, { objective: migration_safety, score: .55 }, { objective: operability, score: .55 }]
    discoveries: [{ branch_id: Kafka, finding: schema governance is mandatory for shared events, evidence: pipeline:Kafka, reusable: true }]
  - branch_id: NATS
    hypothesis: lightweight messaging
    outcome: supported
    outcome_reason: good latency but weaker replay guarantees
    metrics: [{ objective: correctness, score: .88 }, { objective: throughput, score: .90 }, { objective: migration_safety, score: .65 }, { objective: operability, score: .75 }]
    discoveries: [{ branch_id: NATS, finding: backpressure limits must be explicit, evidence: pipeline:NATS, reusable: true }]
  - branch_id: DB-outbox
    hypothesis: transactional outbox
    outcome: supported
    outcome_reason: best behavioral and migration safety
    metrics: [{ objective: correctness, score: .98 }, { objective: throughput, score: .75 }, { objective: migration_safety, score: .95 }, { objective: operability, score: .90 }]
    discoveries: [{ branch_id: DB-outbox, finding: outbox relays need idempotent consumers, evidence: pipeline:DB-outbox, reusable: true }]
  - branch_id: vertical-slices
    hypothesis: slice by use case
    outcome: supported
    outcome_reason: safe incremental modularisation
    metrics: [{ objective: correctness, score: .95 }, { objective: throughput, score: .70 }, { objective: migration_safety, score: .90 }, { objective: operability, score: .85 }]
    discoveries: [{ branch_id: vertical-slices, finding: public contracts map cleanly to slice boundaries, evidence: pipeline:vertical-slices, reusable: true }]
  - branch_id: domain-modules
    hypothesis: enforce domain boundaries
    outcome: supported
    outcome_reason: strong boundaries with moderate migration cost
    metrics: [{ objective: correctness, score: .96 }, { objective: throughput, score: .68 }, { objective: migration_safety, score: .92 }, { objective: operability, score: .80 }]
    discoveries: [{ branch_id: domain-modules, finding: dependency rules expose hidden coupling, evidence: pipeline:domain-modules, reusable: true }]
  - branch_id: Redis-queues
    hypothesis: managed asynchronous queues
    outcome: rejected
    outcome_reason: ordering semantics broke critical workflows
    metrics: [{ objective: correctness, score: .92 }, { objective: throughput, score: .88 }, { objective: migration_safety, score: .70 }, { objective: operability, score: .75 }]
    discoveries: [{ branch_id: Redis-queues, finding: idempotency keys generalise to every worker backend, evidence: pipeline:Redis-queues, reusable: true }]
  - branch_id: custom-scheduler
    hypothesis: own the scheduling runtime
    outcome: rejected
    outcome_reason: operational complexity dominated throughput gains
    metrics: [{ objective: correctness, score: .85 }, { objective: throughput, score: .82 }, { objective: migration_safety, score: .50 }, { objective: operability, score: .40 }]
    discoveries: [{ branch_id: custom-scheduler, finding: lease expiry is required for crash recovery, evidence: pipeline:custom-scheduler, reusable: true }]
objective_weights:
  - { objective: correctness, weight: .40 }
  - { objective: throughput, weight: .25 }
  - { objective: migration_safety, weight: .20 }
  - { objective: operability, weight: .15 }
