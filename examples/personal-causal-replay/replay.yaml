name: personal-causal-replay
checkpoint:
  agent_ref: agent@2026-03-14
  at: 2026-03-14T00:00:00Z
  state:
    latency_ms: 100.0
    consistency_risk: 0.10
    active_users: 100000
history_end: 2026-08-31T23:59:59Z

events:
  - event_id: decision-X
    occurred_at: 2026-03-15T00:00:00Z
    kind: decision
    description: "introduce Redis in front of PostgreSQL"
    effects:
      - key: architecture
        operation: set
        value: redis

  - event_id: april-traffic
    occurred_at: 2026-04-10T00:00:00Z
    kind: observation
    description: "traffic grows after product launch"
    effects:
      - key: latency_ms
        operation: add
        value: 20.0

  - event_id: may-cache-incident
    occurred_at: 2026-05-08T00:00:00Z
    kind: outcome
    description: "cache invalidation creates stale reads"
    depends_on: [decision-X]
    preconditions:
      - key: architecture
        operation: equals
        value: redis
    effects:
      - key: consistency_risk
        operation: add
        value: 0.50

  - event_id: june-growth
    occurred_at: 2026-06-20T00:00:00Z
    kind: external
    description: "the user population continues growing"
    effects:
      - key: active_users
        operation: multiply
        value: 1.5

  - event_id: august-contention
    occurred_at: 2026-08-01T00:00:00Z
    kind: observation
    description: "write contention appears under the August workload"
    effects:
      - key: latency_ms
        operation: add
        value: 50.0
        when:
          - key: architecture
            operation: equals
            value: redis
      - key: latency_ms
        operation: add
        value: 15.0
        when:
          - key: architecture
            operation: equals
            value: postgres

intervention:
  target_event_id: decision-X
  replacement:
    event_id: decision-Y
    occurred_at: 2026-03-15T00:00:00Z
    kind: decision
    description: "keep PostgreSQL and repair the storage path"
    effects:
      - key: architecture
        operation: set
        value: postgres
