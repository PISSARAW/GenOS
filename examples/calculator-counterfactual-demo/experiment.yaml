name: calculator-counterfactual
seed_dir: calculator
branches:
  - id: A
    label: exception
    hypothesis: explicit panic contract
    edits:
      - relative_path: src/lib.rs
        contents: |
          pub fn divide(a: i32, b: i32) -> i32 {
              if b == 0 { panic!("division by zero") }
              a / b
          }
      - relative_path: tests/divide.rs
        contents: |
          use calculator::divide;
          #[test]
          #[should_panic(expected = "division by zero")]
          fn zero() { divide(1, 0); }
    verifications:
      - kind: tests
        command: cargo test --quiet
  - id: B
    label: result-type
    hypothesis: typed recoverable error
    edits:
      - relative_path: src/lib.rs
        contents: |
          #[derive(Debug, PartialEq)]
          pub enum DivideError { DivisionByZero }
          pub fn divide(a: i32, b: i32) -> Result<i32, DivideError> {
              if b == 0 { Err(DivideError::DivisionByZero) } else { Ok(a / b) }
          }
      - relative_path: tests/divide.rs
        contents: |
          use calculator::{divide, DivideError};
          #[test]
          fn zero() { assert_eq!(divide(1, 0), Err(DivideError::DivisionByZero)); }
    verifications:
      - kind: tests
        command: cargo test --quiet
  - id: C
    label: input-validation
    hypothesis: reject invalid divisor before division
    edits:
      - relative_path: src/lib.rs
        contents: |
          pub fn divide(a: i32, b: i32) -> Option<i32> {
              (b != 0).then(|| a / b)
          }
      - relative_path: tests/divide.rs
        contents: |
          use calculator::divide;
          #[test]
          fn zero() { assert_eq!(divide(1, 0), None); }
    verifications:
      - kind: tests
        command: cargo test --quiet
evaluations:
  - branch_id: A
    hypothesis: explicit panic contract
    outcome: supported
    outcome_reason: behavior is explicit but remains unrecoverable
    metrics:
      - { objective: correctness, score: 0.7 }
      - { objective: api_quality, score: 0.4 }
    discoveries: []
  - branch_id: B
    hypothesis: typed recoverable error
    outcome: supported
    outcome_reason: callers must handle division failure explicitly
    metrics:
      - { objective: correctness, score: 1.0 }
      - { objective: api_quality, score: 0.95 }
    discoveries: []
  - branch_id: C
    hypothesis: reject invalid divisor before division
    outcome: supported
    outcome_reason: concise but loses the reason for failure
    metrics:
      - { objective: correctness, score: 0.9 }
      - { objective: api_quality, score: 0.75 }
    discoveries: []
objective_weights:
  - { objective: correctness, weight: 0.6 }
  - { objective: api_quality, weight: 0.4 }
