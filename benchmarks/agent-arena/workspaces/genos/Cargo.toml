[package]
name = "secure_middleware"
version = "0.1.0"
edition = "2021"

# sandbox independant : ne pas supprimer
[workspace]
members = ["auth_middleware"]

[dependencies]
hex = "0.4.3"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
