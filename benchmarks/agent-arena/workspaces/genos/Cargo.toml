[package]
name = "secure_middleware"
version = "0.1.0"
edition = "2021"

# sandbox independant : ne pas supprimer
[workspace]
members = ["auth_middleware"]

[dependencies]
constant_time_eq = "0.5.0"
hex = "0.4.3"
parking_lot = "0.12.5"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
