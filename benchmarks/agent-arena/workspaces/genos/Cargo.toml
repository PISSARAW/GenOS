[package]
name = "secure_middleware"
version = "0.1.0"
edition = "2021"

# sandbox independant : ne pas supprimer
[workspace]
members = ["middleware_core"]

[dependencies]
constant_time_eq = "0.5.0"
sha2 = "0.10"
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
