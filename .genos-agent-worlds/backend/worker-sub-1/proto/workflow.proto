syntax = "proto3";
package genos.workflow;

service WorkflowService {
  rpc Ping (Empty) returns (PingResponse);
  rpc StartWorkflow (StartWorkflowRequest) returns (WorkflowResponse);
  rpc GetWorkflowStatus (WorkflowStatusRequest) returns (WorkflowResponse);
}

message Empty {}
message PingResponse { string status = 1; }
message StartWorkflowRequest { string workflow_name = 1; string initial_data_json = 2; string organization_id = 3; string project_id = 4; }
message WorkflowStatusRequest { string workflow_id = 1; string organization_id = 2; string project_id = 3; }
message WorkflowResponse {
  string workflow_id = 1;
  string status = 2;
  string output_json = 3;
  bool success = 4;
  string error_code = 5;
  string error_message = 6;
}
