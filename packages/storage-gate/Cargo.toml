[package]
name = "genos-storage-gate"
version = "0.1.0"
edition = "2024"
description = "StorageEvolutionGate — benchmarks SQLite vs LadybugDB vs DuckDB for capability promotion"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features=["html_reports"] }

[[bench]]
name = "storage_evolution"
harness = false
