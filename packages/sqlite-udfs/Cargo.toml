[package]
name = "genos-sqlite-udfs"
version = "0.1.0"
edition = "2024"
description = "Deterministic mathematical UDFs for GenOS SQLite"
license = "MIT"

[lib]
name = "genos_sqlite_udfs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "functions"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
