[workspace]
members = [
  "crates/epsilon_mcts",
  "crates/genos_v5_rust",
  "crates/sate-lattice",
  "crates/sate_simulation",
  "crates/sigma_runner",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/PISSARAW/GenOS"
homepage = "https://github.com/PISSARAW/GenOS"
documentation = "https://github.com/PISSARAW/GenOS/tree/main/research"
readme = "README.md"
keywords = ["agents", "ai", "research", "simulation"]
categories = ["algorithms", "simulation"]

[workspace.lints.clippy]
too_many_arguments = "deny"
cognitive_complexity = "deny"
